# ============================================================
# railway.toml — Frameiq Backend
# ============================================================
# Docs: https://docs.railway.com/reference/config-as-code

[build]
# Use our Dockerfile — do NOT let Railway auto-detect with Nixpacks.
# Nixpacks won't install the canvas/FFmpeg system deps we need.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT automatically.
# startCommand is optional here since Dockerfile sets CMD.
startCommand = "node server.js"

# Health check — Railway will wait for this before routing traffic.
# Matches the GET /health route you should add to server.js (see below).
healthcheckPath = "/health"
healthcheckTimeout = 120   # seconds — canvas compile can be slow on first boot

# Auto-restart on crash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway config-as-code cannot create or attach a Volume. This makes an
# existing /data mount a deployment requirement; the environment checklist
# covers creating a different Volume for staging.
requiredMountPath = "/data"

# A second Railway environment can share the same Dockerfile and base config.
# Only staging changes its start command so volume/config validation runs before
# Express opens the port. Railway applies this block only to an environment
# whose name is exactly "staging".
[environments.staging.deploy]
startCommand = "npm run start:staging"
requiredMountPath = "/data"
